<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account Intelligence</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #fff; --text: #1d1d1b; --muted: #66665f; --line: #e2e1dc;
  --accent: #2f5bd3; --accent-soft: #e8eefc; --fact: #1f7a4d; --risk: #a35a00; --hyp: #6b4bb8;
  --ok-bg: #e5f3ea; --warn-bg: #fbf0dd; --none-bg: #eeeeea;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #a8a79f; --line: #34342f;
    --accent: #8aa8ff; --accent-soft: #252c40; --fact: #6fcf9b; --risk: #f0b25a; --hyp: #b9a2f0;
    --ok-bg: #1d3327; --warn-bg: #3a2f1b; --none-bg: #2a2a27;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
h1 { font-size: 18px; margin: 0 0 2px; }
.note, .muted { color: var(--muted); font-size: 12.5px; margin: 0; }
.lens { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-top: 12px; }
.lens label { font-weight: 600; }
#lens-help { flex-basis: 100%; }
main { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; padding: 16px; }
@media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
form { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin-bottom: 8px; }
label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 2px; }
input[type=search], input[type=text], input[type=number], select {
  font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); color: var(--text); min-width: 0; max-width: 100%; }
input[type=search] { width: 220px; }
input[type=number] { width: 80px; }
.lens select { min-width: 260px; }
fieldset { border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; margin: 0; font-size: 12px; }
legend { color: var(--muted); padding: 0 4px; }
fieldset label { display: inline-flex; flex-direction: row; align-items: center; gap: 4px; margin-right: 8px; color: var(--text); }
details.more { flex-basis: 100%; }
details.more > div { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--accent);
  background: var(--accent); color: #fff; cursor: pointer; }
button.secondary { background: transparent; color: var(--accent); }
button.link { border: none; background: none; color: var(--accent); padding: 2px 0; text-decoration: underline; }
button:disabled { opacity: .4; cursor: default; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; width: 3em; }
tbody tr { cursor: pointer; }
tbody tr:hover, tbody tr.selected { background: var(--accent-soft); }
.acct { font-weight: 600; }
.find b { font-weight: 600; }
@media (max-width: 600px) { .c-own { display: none; } }
.chip { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 10px;
  border: 1px solid var(--line); margin: 1px 3px 1px 0; }
.state { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 10px; white-space: nowrap; }
.state-research_candidate { background: var(--ok-bg); color: var(--fact); }
.state-hygiene_only { background: var(--accent-soft); color: var(--accent); }
.state-verify_ownership { background: var(--warn-bg); color: var(--risk); }
.state-context_only, .state-not_a_prospect { background: var(--none-bg); color: var(--muted); }
.pager { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; color: var(--muted); }
h2 { font-size: 17px; margin: 0 0 2px; }
h3 { font-size: 12px; margin: 16px 0 6px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.lead { font-size: 15px; margin: 8px 0 4px; }
.card { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }
.card h4 { margin: 0 0 2px; font-size: 14px; }
.stmt { margin: 4px 0; }
.stmt b { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin-right: 6px; }
.fact b { color: var(--fact); } .risk b { color: var(--risk); } .hyp b { color: var(--hyp); }
.scope { border-left: 3px solid var(--risk); padding: 2px 8px; margin: 4px 0; font-size: 13px; }
ul { margin: 4px 0; padding-left: 20px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
details summary { cursor: pointer; color: var(--accent); font-size: 13px; margin-top: 10px; }
code { font-size: 12px; word-break: break-all; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
.records .card { background: var(--bg); }
#detail > h2 { font-size: 20px; }
.status-bar { display: flex; gap: 8px; align-items: baseline; margin: 10px 0 4px; }
.rank { font-weight: 600; margin: 4px 0 0; }
section.rep { border: none; padding: 0; margin: 0; background: none; border-radius: 0; }
section.rep h3 { border-top: 1px solid var(--line); padding-top: 12px; }
h4 { font-size: 13.5px; margin: 10px 0 4px; }
.threat { margin-bottom: 10px; } .threat p { margin: 2px 0 0; }
blockquote { margin: 4px 0 8px; padding: 6px 12px; border-left: 3px solid var(--accent); background: var(--accent-soft); }
details.bucket { border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; margin-bottom: 8px; }
details.bucket > summary { color: var(--text); margin: 0; font-size: 14px; }
details.bucket[open] > summary { margin-bottom: 6px; }
</style>
</head>
<body>
<header>
  <h1>Cybersecurity account intelligence</h1>
  <p class="note" id="snapshot">Loading…</p>
  <div class="lens">
    <label>Prospecting lens <select id="use-case" aria-label="Prospecting lens">
      <option value="">All supported use cases</option>
    </select></label>
    <p class="muted" id="lens-help">Choose a use case to narrow the research list.</p>
  </div>
</header>
<main>
  <section aria-label="Accounts">
    <form id="filters">
      <label>Search <input type="search" name="q" placeholder="Name, domain or product"></label>
      <label>Observed infrastructure location
        <input type="text" name="country" list="countries" placeholder="Any country" size="12"
               title="Country of the IP addresses (geolocation), not the organisation's headquarters"></label>
      <datalist id="countries"></datalist>
      <label>Status <select name="view" aria-label="Status">
        <option value="research" selected>Pursue</option>
        <option value="hygiene">Pursue for certificate management</option>
        <option value="verify">Confirm ownership first</option>
        <option value="context">Monitor</option>
        <option value="excluded">Do not pursue</option>
        <option value="all">All</option>
      </select></label>
      <button type="submit">Search</button>
      <details class="more"><summary>More filters</summary><div>
        <label>Segment <select name="segment" aria-label="Segment">
          <option value="enterprise" selected>Organisations and domains</option>
          <option value="network_provider">Network providers' own infrastructure</option>
        </select></label>
        <fieldset id="signal-box"><legend>Has all of these findings</legend></fieldset>
        <fieldset><legend>Link to organisation (any of)</legend>
          <label><input type="checkbox" name="ownership" value="high">Strong</label>
          <label><input type="checkbox" name="ownership" value="medium">Likely</label>
          <label><input type="checkbox" name="ownership" value="low">Unconfirmed</label>
        </fieldset>
        <fieldset><legend>Priority band (any of)</legend>
          <label><input type="checkbox" name="band" value="High">Top 1%</label>
          <label><input type="checkbox" name="band" value="Medium">Next 9%</label>
          <label><input type="checkbox" name="band" value="Low">Rest</label>
        </fieldset>
        <fieldset><legend>Attribution tier (technical)</legend>
          <label><input type="checkbox" name="tier" value="A1">A1</label>
          <label><input type="checkbox" name="tier" value="A2">A2</label>
          <label><input type="checkbox" name="tier" value="B">B</label>
          <label><input type="checkbox" name="tier" value="P">P</label>
        </fieldset>
      </div></details>
    </form>
    <p class="muted" id="list-note"></p>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th class="num" title="Rank among eligible accounts; gaps are accounts in another research state">#</th>
          <th>Account</th><th>Main finding</th>
          <th class="c-own" title="How firmly records tie these services to the organisation">Ownership</th>
          <th>Status</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="pager">
      <button class="secondary" id="prev" type="button">Previous</button>
      <span id="count"></span>
      <button class="secondary" id="next" type="button">Next</button>
    </div>
  </section>
  <section aria-label="Account brief" id="detail">
    <p class="empty">Select an account to open its report.</p>
  </section>
</main>
<script>
"use strict";
const PAGE = 50;
const state = { offset: 0, total: 0, signals: {}, useCases: {}, selected: null, snapshot: null, listSeq: 0, detailSeq: 0 };
const OWNERSHIP = { high: "Strong", medium: "Probable", low: "Unconfirmed" };
const LIST_NOTE = {
  research: "Strong ownership link and exposed infrastructure, ranked by exposure.",
  hygiene: "Owned organisations whose findings are certificate and TLS defects. Select the certificate lens to rank them.",
  verify: "Strong findings without confirmed ownership. Confirm ownership before outreach.",
  context: "Linked organisations with no exposure strong enough to open a conversation.",
  excluded: "Registry placeholders, pool labels and provider sub-allocations. Not organisations.",
  all: "Every account, in every status.",
};

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") n.className = v; else if (k === "title") n.title = v; else n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    n.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return n;
}
const fmt = (x, d = 2) => (x === null || x === undefined ? "—" : Number(x).toFixed(d));
const stateChip = (s) => el("span", { class: `state state-${s.code}`, title: s.summary }, s.label);
const signalName = (id) => state.signals[id]?.short_name || state.signals[id]?.name || id;
const list = (items) => el("ul", {}, (items || []).map((x) => el("li", {}, x)));
const topText = (pct) => (pct === null || pct === undefined ? "not ranked"
  : 100 - pct <= 10 ? `top ${Math.max(1, Math.ceil(100 - pct))}%` : `above ${Math.floor(pct)}%`);

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
  return r.json();
}
const useCase = () => document.getElementById("use-case").value;

function query() {
  const f = document.getElementById("filters");
  const p = new URLSearchParams();
  p.set("segment", f.segment.value);
  if (useCase()) p.set("use_case", useCase());
  const q = f.q.value.trim(); if (q) p.set("q", q);
  for (const c of f.country.value.split(/[\s,]+/).filter(Boolean)) p.append("country", c.toUpperCase());
  p.set("view", f.view.value);
  for (const name of ["band", "ownership", "signal", "tier"])
    for (const box of f.querySelectorAll(`input[name=${name}]:checked`)) p.append(name, box.value);
  p.set("limit", PAGE); p.set("offset", state.offset);
  return p;
}

function accountRow(a) {
  const rank = a.use_case ? a.use_case.rank : a.rank;
  const pct = a.use_case ? a.use_case.percentile : a.priority.percentile;
  const mf = a.main_finding;
  const tr = el("tr", { "data-id": a.account_id },
    el("td", { class: "num" }, rank ?? "—"),
    el("td", {}, el("div", { class: "acct" }, a.account_name || a.account_id),
      el("div", { class: "muted" }, [a.account_kind === "domain" ? "domain" : "organisation",
        (a.countries || []).slice(0, 4).join(", ")].filter(Boolean).join(" · "))),
    el("td", { class: "find" }, mf ? [el("b", {}, mf.name), el("div", { class: "muted" }, mf.what_we_saw)] : "—"),
    el("td", { class: "c-own" }, OWNERSHIP[a.ownership.confidence] || "—"),
    el("td", {}, stateChip(a.research_state), el("div", { class: "muted" }, topText(pct))));
  if (a.account_id === state.selected) tr.classList.add("selected");
  tr.addEventListener("click", () => { location.hash = "account=" + encodeURIComponent(a.account_id); });
  return tr;
}

async function loadAccounts() {
  const tbody = document.getElementById("rows");
  const view = document.getElementById("filters").view.value;
  const uc = state.useCases[useCase()];
  document.getElementById("list-note").textContent = (uc ? `${uc.name}: ranked on ${uc.signals.map((s) => s.name.toLowerCase()).join(", ")} evidence only. ` : "") + LIST_NOTE[view];
  const seq = ++state.listSeq;
  let body;
  try { body = await getJSON(`/accounts?${query()}`); }
  catch (e) { if (seq === state.listSeq) tbody.replaceChildren(el("tr", {}, el("td", { colspan: 5, class: "empty" }, `Error: ${e.message}`))); return; }
  if (seq !== state.listSeq) return;  // a newer request superseded this one
  state.total = body.total;
  tbody.replaceChildren(...body.items.map(accountRow));
  if (!body.items.length) tbody.replaceChildren(el("tr", {}, el("td", { colspan: 5, class: "empty" }, "No accounts match these filters.")));
  const end = Math.min(state.offset + body.items.length, state.total);
  document.getElementById("count").textContent = state.total ? `${state.offset + 1}–${end} of ${state.total}` : "0 accounts";
  document.getElementById("prev").disabled = state.offset === 0;
  document.getElementById("next").disabled = end >= state.total;
}

function statement(cls, label, text) {
  return el("p", { class: `stmt ${cls}` }, el("b", {}, label), el("span", {}, text || "—"));
}

function recordCard(e) {
  const s = e.service, p = e.provenance;
  return el("div", { class: "card" },
    statement("fact", "Observed", e.observed_fact),
    e.counted ? null : el("p", { class: "muted" },
      `Counted once, under ${signalName(e.suppressed_by) || "a stronger finding"} on the same service.`),
    el("details", {}, el("summary", {}, "Service and source record"),
      el("dl", { class: "kv" },
        el("dt", {}, "Service"), el("dd", {}, `${s.ip}:${s.port}/${s.transport}${s.sni ? " · TLS name " + s.sni : ""}`),
        el("dt", {}, "Observed"), el("dd", {}, s.observed_at ? s.observed_at + " (UTC)" : "—"),
        el("dt", {}, "Product"), el("dd", {}, [s.product, s.version].filter(Boolean).join(" ") || "—"),
        el("dt", {}, "Location"), el("dd", {}, s.country_code ? `${s.country_code} (IP geolocation)` : "—"),
        el("dt", {}, "Scanner probe"), el("dd", {}, s.module || "—"),
        el("dt", {}, "Matched on"), el("dd", {}, e.match_basis || "—"),
        el("dt", {}, "Linked by"), el("dd", {}, [`tier ${e.tier}`, `confidence ${fmt(e.attribution_confidence)}`,
          (e.attribution_reasons || []).join(", "), (e.attribution_domains || []).join(", ")].filter(Boolean).join(" · ")),
        el("dt", {}, "Observation"), el("dd", {}, el("code", {}, p.observation_id)),
        el("dt", {}, "Record"), el("dd", {}, p.file_id ? el("code", {}, `file ${p.file_id} @ ${p.byte_offset} +${p.byte_length}`)
          : "raw file location withheld in this deployment (traceable internally by observation and SHA-256)"),
        el("dt", {}, "SHA-256"), el("dd", {}, el("code", {}, p.record_sha256)))));
}

async function loadRecords(id, signal, box, offset) {
  const body = await getJSON(`/accounts/${encodeURIComponent(id)}/evidence?signal=${encodeURIComponent(signal)}&limit=${PAGE}&offset=${offset}`);
  box.querySelector(".more")?.remove();
  box.append(...body.items.map(recordCard));
  const shown = offset + body.items.length;
  if (shown < body.total) {
    const more = el("button", { class: "secondary more", type: "button" }, `Show more records (${body.total - shown} left)`);
    more.addEventListener("click", () => loadRecords(id, signal, box, shown));
    box.append(more);
  }
  if (!body.total) box.append(el("p", { class: "muted" }, "No endpoint records."));
}

function evidenceBucket(id, f) {
  const box = el("div", { class: "records" });
  const toggle = el("button", { class: "link", type: "button", "aria-expanded": "false" },
    `Show endpoint records (${f.n_services})`);
  toggle.addEventListener("click", async () => {
    const open = toggle.getAttribute("aria-expanded") === "true";
    toggle.setAttribute("aria-expanded", String(!open));
    toggle.textContent = open ? `Show endpoint records (${f.n_services})` : "Hide endpoint records";
    if (open) { box.replaceChildren(); return; }
    box.replaceChildren(el("p", { class: "muted" }, "Loading…"));
    try { box.replaceChildren(); await loadRecords(id, f.signal_id, box, 0); }
    catch (e) { box.replaceChildren(el("p", { class: "muted" }, `Could not load records: ${e.message}`)); }
  });
  return el("details", { class: "bucket finding" },
    el("summary", {}, el("b", {}, f.name), ` — ${f.count}`),
    el("dl", { class: "kv" },
      el("dt", {}, f.signal_id === "S06" ? "Defects" : "Products"), el("dd", {}, f.products.join(", ") || "Not named"),
      f.notes.length ? [el("dt", {}, "Note"), el("dd", {}, f.notes.join(" "))] : null,
      f.counting_note ? [el("dt", {}, "Counting"), el("dd", {}, f.counting_note)] : null),
    toggle, box);
}

function section(title, ...kids) {
  return el("section", { class: "rep" }, el("h3", {}, title), ...kids);
}

function technical(a) {
  const pr = a.priority, own = a.ownership;
  return el("details", { class: "bucket technical" }, el("summary", {}, el("b", {}, "Ranking and scoring details")),
    el("dl", { class: "kv" },
      el("dt", {}, "Account id"), el("dd", {}, el("code", {}, a.account_id)),
      el("dt", {}, "Priority"), el("dd", {}, `${pr.band || "unranked"} band, percentile ${pr.percentile ?? "—"} of ${pr.population || "accounts"}, overall rank ${a.rank ?? "—"}`),
      el("dt", {}, "Formula"), el("dd", {}, `priority ${fmt(pr.value, 1)} = 100 × relevance ${fmt(pr.product_relevance)} × breadth ${fmt(pr.signal_strength)}`),
      ...(a.use_cases || []).flatMap((u) => [el("dt", {}, u.name), el("dd", {}, `lens rank ${u.rank ?? "—"}, priority ${fmt(u.priority, 1)}, ${u.n_services} services on ${u.n_ips} IPs, evidence quality ${fmt(u.evidence_quality)} (${u.signal_ids.join(", ")})`)]),
      el("dt", {}, "Ownership"), el("dd", {}, `${own.confidence} · best tier ${own.best_tier} · mean attribution ${fmt(own.mean_attribution_confidence)} · ${(own.reasons || []).join(", ")}`),
      el("dt", {}, "Review flags"), el("dd", {}, (own.review_flags || []).join(", ") || "none"),
      el("dt", {}, "Evidence quality"), el("dd", {}, `${a.evidence.quality} (mean match basis ${fmt(a.evidence.mean_basis_quality)})`),
      el("dt", {}, "Eligibility"), el("dd", {}, [a.eligibility.status, ...(a.eligibility.reasons || [])].join(", ")),
      el("dt", {}, "Gate"), el("dd", {}, a.actionable_blockers.length ? a.actionable_blockers.join(", ") : "passes"),
      el("dt", {}, "Signals"), el("dd", {}, a.signal_ids.map((s) => `${s} ${state.signals[s]?.name || ""}`).join("; ")),
      el("dt", {}, "Legacy v2 score"), el("dd", {}, `${fmt(a.legacy.score, 1)} · rank ${a.legacy.rank} (comparison only)`),
      el("dt", {}, "Versions"), el("dd", {}, `scoring v${a.scoring_version}, eligibility v${a.eligibility_version}`)),
    el("h4", {}, "Scoring explanation"), list(a.explanation),
    el("h4", {}, "Method"), el("p", { class: "muted" }, a.disclaimer));
}

async function showAccount(id) {
  state.selected = id;
  for (const tr of document.querySelectorAll("#rows tr")) tr.classList.toggle("selected", tr.dataset.id === id);
  const panel = document.getElementById("detail");
  panel.replaceChildren(el("p", { class: "muted" }, "Loading…"));
  let a;
  const uc = useCase();
  const seq = ++state.detailSeq;
  try { a = await getJSON(`/accounts/${encodeURIComponent(id)}${uc ? "?use_case=" + uc : ""}`); }
  catch (e) { if (seq === state.detailSeq) panel.replaceChildren(el("p", { class: "empty" }, `Could not load account: ${e.message}`)); return; }
  if (seq !== state.detailSeq) return;
  const b = a.brief, c = b.counts, p = b.pitch;
  panel.replaceChildren(...[
    el("h2", {}, a.account_name || a.account_id),
    el("p", { class: "muted" }, [a.account_kind === "domain" ? "Domain" : "Organisation",
      b.fit.infrastructure_location.length ? `Infrastructure in ${b.fit.infrastructure_location.join(", ")}` : null,
      `Ownership: ${b.ownership.label}`].filter(Boolean).join(" · ")),
    el("div", { class: "status-bar" }, stateChip(b.research_state), el("span", {}, b.research_state.summary)),
    el("p", { class: "rank", id: "priority-line" }, b.priority.summary),

    section("Summary", el("p", { class: "lead" }, b.summary)),

    b.threats.length ? section("Key threats", b.threats.map((t) => el("div", { class: "threat" },
      el("h4", {}, t.name, el("span", { class: "muted" }, ` · ${t.count}${t.products.length ? " · " + t.products.slice(0, 4).join(", ") : ""}`)),
      el("p", {}, t.threat)))) : null,

    section("Why target them", list(b.why_target)),

    p ? section("Recommended pitch",
      el("dl", { class: "kv" },
        el("dt", {}, "Lead with"), el("dd", {}, el("b", {}, p.lead_offering)),
        el("dt", {}, "Reach"), el("dd", {}, p.buyer)),
      el("h4", {}, "Opening line"), el("blockquote", {}, p.opener),
      el("h4", {}, "Talking points"), list(p.talking_points),
      el("h4", {}, "Discovery questions"), list(p.discovery_questions)) : null,

    section("Action plan", el("ol", {}, b.action_plan.map((x) => el("li", {}, x)))),

    b.confirm_on_call.length && b.research_state.code !== "not_a_prospect"
      ? section("Confirm on the call", list(b.confirm_on_call)) : null,

    b.competitive_context ? section("Competitive context",
      el("p", {}, el("b", {}, b.competitive_context.vendors.join(", ")), ` — ${b.competitive_context.count}`),
      el("p", {}, b.competitive_context.pitch)) : null,

    section("Supporting evidence",
      b.findings.map((f) => evidenceBucket(a.account_id, f)),
      el("details", { class: "bucket" }, el("summary", {}, el("b", {}, "Ownership evidence"), ` — ${b.ownership.label}`),
        el("p", {}, b.ownership.summary),
        el("dl", { class: "kv" },
          el("dt", {}, "Services with findings"), el("dd", {}, `${c.services_with_findings.toLocaleString()} — ${c.definitions.services_with_findings}`),
          el("dt", {}, "IP addresses with findings"), el("dd", {}, `${c.ips_with_findings.toLocaleString()} — ${c.definitions.ips_with_findings}`),
          el("dt", {}, "All linked services"), el("dd", {}, `${c.all_attributed_services?.toLocaleString() ?? "Not counted"} — ${c.definitions.all_attributed_services}`))),
      b.fit.use_cases.length ? el("details", { class: "bucket" }, el("summary", {}, el("b", {}, "Rank by solution area")),
        el("dl", { class: "kv" }, b.fit.use_cases.flatMap((u) => [el("dt", {}, u.name),
          el("dd", {}, u.rank ? `#${u.rank.toLocaleString()}${u.of ? " of " + u.of.toLocaleString() : ""}` : "Not ranked")]))) : null,
      technical(a),
      el("details", { class: "bucket" }, el("summary", {}, el("b", {}, "Data source")), el("p", {}, b.source))),
  ].flat(Infinity).filter((x) => x !== null && x !== undefined && x !== false));
  if (window.matchMedia("(max-width: 900px)").matches) panel.scrollIntoView({ behavior: "smooth" });
}

function fromHash() {
  const m = location.hash.match(/^#account=(.+)$/);
  if (m) showAccount(decodeURIComponent(m[1]));
}

async function loadFacets() {
  const segment = document.getElementById("filters").segment.value;
  const [ucs, locs] = await Promise.all([getJSON(`/use-cases?segment=${segment}`), getJSON(`/locations?segment=${segment}`)]);
  const sel = document.getElementById("use-case"), keep = sel.value;
  sel.replaceChildren(el("option", { value: "" }, `All supported use cases (${ucs.all.research.toLocaleString()} to pursue)`),
    ...ucs.items.map((u) => el("option", { value: u.id }, `${u.name} (${u.counts.research.toLocaleString()})`)));
  sel.value = keep;
  for (const u of ucs.items) state.useCases[u.id] = u;
  document.getElementById("countries").replaceChildren(...locs.items.map((l) =>
    el("option", { value: l.country_code }, `${l.research.toLocaleString()} to pursue`)));
}

function lensHelp() {
  const u = state.useCases[useCase()];
  document.getElementById("lens-help").textContent = u ? u.description : "Choose a use case to narrow the research list.";
}

async function init() {
  try {
    const h = await getJSON("/health");
    state.snapshot = h.snapshot_id;
    document.getElementById("snapshot").textContent = `Internet-wide scan of ${h.snapshot_id || "unknown date"} · organisations ranked by internet-facing exposure`;
    const reg = await getJSON("/signals");
    const box = document.getElementById("signal-box");
    for (const s of reg.signals) {
      state.signals[s.id] = s;
      box.append(el("label", { title: s.name }, el("input", { type: "checkbox", name: "signal", value: s.id }), s.short_name || s.name));
    }
    await loadFacets();
  } catch (e) { document.getElementById("snapshot").textContent = `API unavailable: ${e.message}`; }
  const f = document.getElementById("filters");
  const reload = () => { state.offset = 0; loadAccounts(); };
  f.addEventListener("submit", (ev) => { ev.preventDefault(); reload(); });
  f.view.addEventListener("change", reload);
  f.segment.addEventListener("change", async () => { await loadFacets(); reload(); });
  document.getElementById("use-case").addEventListener("change", () => { lensHelp(); reload(); if (state.selected) showAccount(state.selected); });
  document.getElementById("prev").addEventListener("click", () => { state.offset = Math.max(0, state.offset - PAGE); loadAccounts(); });
  document.getElementById("next").addEventListener("click", () => { state.offset += PAGE; loadAccounts(); });
  window.addEventListener("hashchange", fromHash);
  await loadAccounts();
  fromHash();
}
init();
</script>
</body>
</html>
