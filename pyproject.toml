[project]
name = "firmable-intel"
version = "0.1.0"
description = "Evidence-backed cybersecurity buying signals from internet-scan data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "orjson>=3.10",
    "pyarrow>=17",
    "duckdb>=1.1",
    "publicsuffixlist>=1.1.2.20261109",
    "fastapi>=0.162.2",
    "uvicorn[standard]>=0.54.0",
    "anthropic>=2.8.0",
]

[project.scripts]
firmable = "firmable.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firmable"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running benchmark or real-data tests"]
